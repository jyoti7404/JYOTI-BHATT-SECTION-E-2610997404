<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser title -->
    <title>My Favorites</title>
</head>
<body>

    <!-- Main heading -->
    <h1>My Favorites</h1>

    <!-- Heading for Ordered List -->
    <h2>My Top 5 Favorite Activities</h2>

    <!-- Ordered list starting from 3 -->
    <ol start="3">
        <li>Coding</li>
        <li>Reading Books</li>
        <li>Playing Chess</li>
        <li>Listening to Music</li>
        <li>Traveling</li>
    </ol>

    <!-- Horizontal line between the two lists -->
    <hr>

    <!-- Heading for Unordered List -->
    <h2>My Top 5 Favorite Foods</h2>

    <!-- Unordered list with square bullets -->
    <ul style="list-style-type: square;">
        <li>Pizza</li>
        <li>Sushi</li>
        <li>Pasta</li>
        <li>Tacos</li>
        <li>Ice Cream</li>
    </ul>

</body>
</html>
