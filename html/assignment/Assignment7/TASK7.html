<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>world map explorer</title>
</head>
<body>
<img src="worldmap.jpg" alt="map" usemap="#world">
<map name="world">
    <area
    shape="rect"
    coords="568,181,595,208"
    href="https://en.wikipedia.org/wiki/Egypt"
    alt="Egypt"
    target="_blank">
    <area
   shape="circle"
   coords="607,253,24"
   href="https://en.wikipedia.org/wiki/Ethiopia"
   alt="Ethiopia"
   target="_blank">
   <area
   shape="poly"
   coords="712,251,696,228,683,192,696,164,717,191,753,193,721,225,"
   href="https://en.wikipedia.org/wiki/India"
   alt="India"
   target="_blank">
   <area
   shape="default"
   href="https://en.wikipedia.org/wiki/World"
   alt="world"
   target="_blank">
</map>
</body>
</html>
