<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>

    <h2>Readers' Haven - Book Registration & Order Form</h2>

    
    <form action="#" method="post" target="_self" enctype="multipart/form-data">

       
        <input type="hidden" name="form_type" value="Readers Haven Book Order">

       
        <label for="customer_name">Customer Name:</label>
        <input type="text" id="customer_name" name="customer_name" required placeholder="Enter your full name"><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="example@mail.com"><br><br>

        
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" placeholder="10-digit mobile number"><br><br>

        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="12" max="100" placeholder="Enter age"><br><br>

       
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="Enter password"><br><br>

       
        <label for="delivery_date">Delivery Date:</label>
        <input type="date" id="delivery_date" name="delivery_date"><br><br>

        <label for="delivery_time">Preferred Delivery Time:</label>
        <input type="time" id="delivery_time" name="delivery_time"><br><br>

       
        <label for="book_category">Favorite Book Category:</label>
        <select id="book_category" name="book_category" required>
            <option value="" disabled selected>-- Select a Category --</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Children's Books">Children's Books</option>
        </select><br><br>

        <label for="book_title">Book Title:</label>
        <input type="text" id="book_title" name="book_title" placeholder="Enter book title"><br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1"><br><br>

      
        <label>Preferred Payment Method:</label><br>
        <input type="radio" id="cod" name="payment_method" value="Cash on Delivery">
        <label for="cod">Cash on Delivery</label>
        <input type="radio" id="online" name="payment_method" value="Online Payment">
        <label for="online">Online Payment</label><br><br>

        <label>Additional Services:</label><br>
        <input type="checkbox" id="gift_wrapping" name="services" value="Gift Wrapping">
        <label for="gift_wrapping">Gift Wrapping</label>
        <input type="checkbox" id="bookmark" name="services" value="Bookmark Express Delivery">
        <label for="bookmark">Bookmark Express Delivery</label>
        <input type="checkbox" id="greeting_card" name="services" value="Greeting Card">
        <label for="greeting_card">Greeting Card</label><br><br>

        <label for="reference_doc">Upload Reference Image/Document:</label><br>
        <input type="file" id="reference_doc" name="reference_doc" accept="image/*,.pdf"><br><br>

         <label for="address_instructions">Delivery Address:</label><br>
         <textarea id="address_instructions" name="address_instructions" rows="4" cols="50" placeholder="Enter your delivery address here..."></textarea><br><br>
         <label for="special_instructions">Special Instructions:</label><br>
         <textarea id="special_instructions" name="special_instructions" rows="4" cols="50" placeholder="Enter any special instructions here..."></textarea><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
