<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
        }

        .menu-image {
            width: 789px;
            height: 689px;
            border: 3px solid #333;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Interactive Restaurant Menu</h1>

    <p>
        Click on different food items to open their information pages.
    </p>

    <!-- Restaurant Image -->
    <img src="restaurant.jpg.png"
         alt="Restaurant food menu"
         class="menu-image"
         usemap="#restaurantMap">

    <!-- Image Map -->
    <map name="restaurantMap">

        <map name="restaurantMap">

    <!-- BURGER - CIRCLE -->
    <area
        shape="circle"
        coords="691,182,92"
        href="https://www.myntra.com/"
        alt="Burger"
        target="_blank">

    <!-- FRENCH FRIES - RECTANGLE -->
    <area
        shape="rect"
        coords="203,108,316,262"
        href="https://www.amazon.in/"
        alt="French Fries"
        target="_blank">

    <!-- MENU CARD - RECTANGLE -->
    <area
        shape="rect"
        coords="326,81,455,336"
        href="https://learnxinyminutes.com/"
        alt="Menu Card"
        target="_blank">

    <!-- SANDWICH - POLYGON -->
    <area
        shape="poly"
        coords="462,84,598,84,614,276,509,313,462,269"
        href="https://devdocs.io/html/reference/attributes"
        alt="Sandwich"
        target="_blank">

    <!-- CAKE SLICE - POLYGON -->
    <area
        shape="poly"
        coords="23,310,172,330,200,437,31,478"
        href="https://cheatography.com/programming/"
        alt="Cake Slice"
        target="_blank">

    <!-- PIZZA - CIRCLE -->
    <area
        shape="circle"
        coords="103,188,107"
        href="https://music.youtube.com/"
        alt="Pizza"
        target="_blank">

    <!-- REMAINING AREA - DEFAULT -->
    <area
        shape="default"
        href="https://www.w3schools.com/"
        alt="Other food area"
        target="_blank">

</map>
</html>
