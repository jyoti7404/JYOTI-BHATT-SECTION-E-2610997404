<!----Student Information Form---->
<html>
<head>
    <title>Student Information Form</title>
</head>
<body>
    <h1>Student Information Form</h1>
    <form>
        <label for="Full Name">Full Name:</label>
        <input type="text" id="fullName" name="fullName">
        <br><br>
        <label for = "Age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>
        <label for ="Gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>
        <label for ="course">Course:</label>
        <input type="radio" id="course" name="course" value="course1">
        <label for="course">Bsc</label>
        <input type="radio" id="course2" name="course" value="course2">
        <label for="course2">B.Tech</label>
        <input type="radio" id="course3" name="course" value="course3">
        <label for="course3">Bca</label>
        <br><br>
        <label for="skills">Skills:</label>
        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label>
        <input type="checkbox" id="java" name="skills" value="java">
        <label for="java">Java</label>
        <input type="checkbox" id="csharp" name="skills" value="csharp">
        <label for="Css">CSS</label>  
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="Javascript">Javascript</label>  
        <input type="checkbox" id="javascript" name="skills" value="javascript">    
        <label for="HTML">HTML</label>
        <input type="checkbox" id="HTML" name="skills" value="HTML">
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
