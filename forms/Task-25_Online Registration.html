<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration Form</title>
</head>
<body>

    <h2>Online Course Registration Form</h2>

    <form action="#" method="post">
        <!-- Task 3: Hidden Input Field -->
        <input type="hidden" name="form_type" value="Online Course Registration">

        <!-- Task 1 & Task 4: Student Name Field -->
        <label for="fullname">Student Name:</label><br>
        <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="50" placeholder="Enter your full name"><br><br>

        <!-- Task 1 & Task 4: Email Address Field -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required placeholder="example@mail.com"><br><br>

        <!-- Task 1 & Task 4: Mobile Number Field -->
        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" placeholder="10-digit mobile number"><br><br>

        <!-- Task 2 & Task 4: Drop-down list for Course Selection -->
        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="" disabled selected>-- Choose a Course --</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
        </select><br><br>

        <!-- Task 5: Submit and Reset controls -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
